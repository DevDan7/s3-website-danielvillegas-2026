<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 | Daniel Villegas</title>
<style>
  /* Mismos tokens que index.html (tema AI Mentoring) */
  :root{
    --bg: #0F1720;
    --surface-2: #1F2B38;
    --border: #2A3846;
    --text: #E7ECF1;
    --text-muted: #93A2B1;
    --accent: #F2B705;
    --accent-hover: #FFC933;
    --radius: 0.625rem;
    --font: system-ui, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, Helvetica, Arial, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.6; -webkit-font-smoothing:antialiased;}
  .wrap{width:100%; max-width:1040px; margin:0 auto; padding:0 16px;}
  a{color:inherit; text-decoration:none;}
  a:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius);}
  nav{padding:18px 0; border-bottom:1px solid var(--border);}
  .logo{font-weight:700; letter-spacing:0.01em;}
  .logo span{color:var(--accent);}
  main{flex:1; display:flex; align-items:center;}
  .code{font-family:var(--font-mono); font-size:0.9rem; color:var(--text-muted); margin-bottom:12px;}
  h1{font-weight:800; font-size:clamp(2rem, 6vw, 2.75rem); line-height:1.1; letter-spacing:-0.02em; margin-bottom:14px;}
  h1 span{color:var(--accent);}
  p{color:var(--text-muted); max-width:52ch; margin-bottom:28px;}
  .btn{display:inline-flex; padding:0.7rem 1.2rem; border-radius:var(--radius); font-size:0.95rem; font-weight:600; background:var(--accent); color:var(--bg); transition:background .15s ease;}
  .btn:hover{background:var(--accent-hover);}
</style>
</head>
<body>
  <nav><div class="wrap"><a class="logo" href="/">daniel<span>@</span>villegas</a></div></nav>
  <main>
    <div class="wrap">
      <div class="code">$ curl -I &rarr; HTTP 404 Not Found</div>
      <h1 data-i18n="title"><span>404</span> · Página não encontrada</h1>
      <p data-i18n="text">O recurso que você procura não existe neste bucket ou foi movido.</p>
      <a class="btn" href="/" data-i18n="back">Voltar ao início</a>
    </div>
  </main>
<script>
  // Idioma según el navegador; PT por defecto, igual que index.html
  const t = {
    es: { title: '<span>404</span> · Página no encontrada', text: 'El recurso que buscás no existe en este bucket o fue movido.', back: 'Volver al inicio' },
    en: { title: '<span>404</span> · Page not found', text: "The resource you're looking for doesn't exist in this bucket or has been moved.", back: 'Back to home' }
  };
  const lang = (navigator.language || 'pt').slice(0, 2);
  if (t[lang]) {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t[lang][el.dataset.i18n]; });
  }
</script>
</body>
</html>
